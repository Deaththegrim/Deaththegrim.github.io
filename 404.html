<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not here</title>
<meta name="description" content="Nothing is at this address.">
<link rel="canonical" href="https://deaththegrim.github.io/">
<meta name="theme-color" content="#3b82f6">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Not here">
<meta property="og:description" content="Nothing is at this address.">
<meta property="og:url" content="https://deaththegrim.github.io/">
<meta property="og:image" content="https://deaththegrim.github.io/asagiri-isles-lore/card.jpg">
<meta property="og:image:width" content="1200">

<style>:root { color-scheme: dark; --bg: #0f1419; --surface: #161d24; --border: #2d3744; --text: #e2e8f0; --muted: #94a3b8;
  --accent: #3b82f6; --accent-soft: #60a5fa; --on-accent: #ffffff; --button: #1d4ed8; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.7 Inter, Ubuntu, "Noto Sans", "DejaVu Sans", system-ui, sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 48px 16px; }
h1 { font-size: 32px; line-height: 1.2; margin: 0 0 8px; }
.lede { color: var(--muted); margin: 0 0 32px; }
.sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 24px; }
.site { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.site img { width: 100%; aspect-ratio: 1200 / 630; display: block; }   /* the whole card: its own title is part of the picture */
.site div { padding: 8px 24px 24px; }
.site h2 { font-size: 22px; margin: 16px 0 4px; }
.site .world { color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; margin: 0; }
a { color: var(--accent-soft); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 2px; }
.links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
.links a { padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); }
.links a.primary { background: var(--button); color: var(--on-accent); border-color: var(--button); }   /* 6.7:1 */
@media (max-width: 700px) { .site div { padding: 8px 16px 16px; } }</style>
</head>
<body>
<main>
<h1>Nothing is at this address</h1>
<p class="lede">Try one of the lorebooks:</p>
<ul><li><a href="/asagiri-isles-lore/">Asagiri Lorebook</a></li></ul>
<p><a href="/">All the worlds</a></p>
</main>
</body>
</html>
