<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not here</title>
<meta name="description" content="Nothing is at this address.">
<link rel="canonical" href="https://deaththegrim.github.io/">
<meta name="theme-color" content="#100d22">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Not here">
<meta property="og:description" content="Nothing is at this address.">

<style>:root { color-scheme: dark; --night: #100d22; --hat: #1d2457; --gold: #e9b64a; --ember: #ff5a2a;
  --spiral: #3fc7ff; --paper: #f4eddc; --mute: #aeb0d2; --surface: #161433; --color-accent-hover: #f5cb6e;
  --hairline: rgba(244, 237, 220, .14);
  --font-show: Anton, Impact, "Arial Narrow", sans-serif; --font-ui: Barlow, "Segoe UI", Ubuntu, "DejaVu Sans", system-ui, sans-serif;
  --font-hand: "Caveat Brush", "Comic Sans MS", cursive; --font-mono: "JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace; }
@font-face { font-family: "Anton"; font-weight: 400; font-display: swap; src: url(/fonts/anton-400.woff2) format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 400; font-display: swap; src: url(/fonts/barlow-400.woff2) format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 500; font-display: swap; src: url(/fonts/barlow-500.woff2) format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 600 700; font-display: swap; src: url(/fonts/barlow-600.woff2) format("woff2"); }
@font-face { font-family: "Caveat Brush"; font-weight: 400; font-display: swap; src: url(/fonts/caveat-brush-400.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 400 800; font-display: swap; src: url(/fonts/jetbrains-mono.woff2) format("woff2"); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--night); color: var(--paper); font: 17px/1.6 var(--font-ui); }
main { position: relative; overflow: hidden; max-width: 1080px; margin: 0 auto; padding: 48px 16px 64px; }
.sigil { position: absolute; right: -60px; top: -20px; width: 380px; height: 380px; color: var(--gold); opacity: .07; pointer-events: none; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.bill { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 48px; align-items: center; margin: 0 0 56px; }
.eye { display: flex; align-items: center; gap: 8px; margin: 0; font: 700 11px/1 var(--font-mono); letter-spacing: .18em;
  text-transform: uppercase; color: var(--spiral); }
.eye::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--spiral); box-shadow: 0 0 10px var(--spiral); }
.patter { margin: 14px 0 4px; font: 28px/1.1 var(--font-hand); color: var(--gold); transform: rotate(-2deg); transform-origin: left center; }
h1 { margin: 0; font: 400 clamp(52px, 9vw, 110px)/.86 var(--font-show); text-transform: uppercase; color: var(--paper); }
h1 .hot { display: block; position: relative; width: fit-content; color: var(--ember); }
h1 .hot::after { content: ""; position: absolute; left: 2%; right: -6%; bottom: -10px; height: 7px; background: var(--spiral);
  transform: skewX(-24deg) rotate(-1.5deg); }
.lede { max-width: 52ch; margin: 28px 0 0; color: var(--mute); }
.host { position: relative; border: 3px solid var(--gold); background: var(--night); transform: rotate(-4deg); box-shadow: 6px 6px 0 var(--ember); }
.host img { display: block; width: 100%; height: auto; }
.bubble { position: absolute; left: -64px; top: -40px; max-width: 220px; margin: 0; padding: 8px 12px; font: 22px/1.05 var(--font-hand);
  color: var(--night); background: var(--paper); transform: rotate(5deg); box-shadow: 4px 4px 0 var(--ember); }
.sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 40px 32px; }
.site { position: relative; background: var(--surface); border: 1px solid var(--hairline); }
.site .act { margin: 0; padding: 12px 20px; font: 700 11px/1 var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--gold);
  border-bottom: 1px solid var(--hairline); }
.site img { width: 100%; height: auto; aspect-ratio: 1200 / 630; display: block; }
.site div { padding: 8px 20px 24px; }
.site h2 { margin: 16px 0 4px; font: 400 32px/1 var(--font-show); letter-spacing: .02em; text-transform: uppercase; }
.site h2 a { color: var(--paper); }
.site p { color: var(--mute); }
a { color: var(--spiral); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.links { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 16px; }
/* a ticket: the lorebooks' own (lorebook_house.ticket_css) */
.ticket { --tk: var(--gold); position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
  font: 400 17px/1 var(--font-show); letter-spacing: .06em; text-transform: uppercase; color: var(--night); border-radius: 0;
  box-shadow: 4px 4px 0 var(--ember);
  background: radial-gradient(circle at 0 50%, transparent 6px, var(--tk) 6.5px) left / 51% 100% no-repeat,
              radial-gradient(circle at 100% 50%, transparent 6px, var(--tk) 6.5px) right / 51% 100% no-repeat; }
.ticket small { font: 700 10px/1 var(--font-mono); letter-spacing: .12em; border-left: 2px dashed rgba(16, 13, 34, .5); padding-left: 8px; }
.ticket.blue { --tk: var(--spiral); box-shadow: 4px 4px 0 var(--hat); }
.ticket.hot { --tk: var(--ember); box-shadow: 4px 4px 0 var(--hat); }
.ticket:hover { --tk: var(--color-accent-hover); color: var(--night); text-decoration: none; }
.ticket.blue:hover, .ticket.hot:hover { --tk: var(--paper); }
.ticket:focus-visible { outline: 3px solid var(--paper); outline-offset: 4px; }
@media (max-width: 700px) {
  .bill { grid-template-columns: 1fr; gap: 24px; }   /* phones: the host below the bill, his bubble beside him, nothing over the words */
  .host { width: 140px; justify-self: end; margin-right: 8px; }
  .bubble { left: auto; right: calc(100% + 16px); top: 24px; width: 170px; max-width: none; font-size: 17px; }
  .site div { padding: 8px 16px 16px; }
}</style>
</head>
<body>
<main>
<h1>Nothing is at this address</h1>
<p class="lede">Try one of the lorebooks:</p>
<ul><li><a href="/asagiri-isles-lore/">Asagiri Lorebook</a></li><li><a href="/avatar-lore/">Avatar Lorebook</a></li><li><a href="/hunter-x-hunter-lore/">Hunter x Hunter Lorebook</a></li><li><a href="/fma-brotherhood-lore/">Fullmetal Alchemist Lorebook</a></li></ul>
<p><a href="/">All the worlds</a></p>
</main>
</body>
</html>
